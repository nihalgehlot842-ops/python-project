{% extends "base.html" %}
{% block title %}{{ 'Add student' if mode == 'add' else 'Edit student' }}{% endblock %}
{% block content %}
<h1>{{ 'Add student' if mode == 'add' else 'Edit student' }}</h1>

<form class="student-form" method="post">
  <label>Roll number
    <input type="text" name="roll_no" value="{{ student['roll_no'] }}" required>
  </label>
  <label>Full name
    <input type="text" name="name" value="{{ student['name'] }}" required>
  </label>
  <label>Email
    <input type="email" name="email" value="{{ student['email'] }}" required>
  </label>
  <label>Phone
    <input type="tel" name="phone" value="{{ student['phone'] or '' }}">
  </label>
  <label>Course
    <input type="text" name="course" value="{{ student['course'] }}" placeholder="e.g. B.Tech Computer Science" required>
  </label>
  <label>Year
    <select name="year" required>
      {% for y in range(1, 7) %}
        <option value="{{ y }}" {{ 'selected' if student['year']|string == y|string }}>Year {{ y }}</option>
      {% endfor %}
    </select>
  </label>
  <div class="form-actions">
    <button type="submit" class="btn">{{ 'Save student' if mode == 'add' else 'Save changes' }}</button>
    <a class="link" href="{{ url_for('index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
